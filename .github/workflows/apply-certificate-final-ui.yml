name: Apply certificate issuer update
on:
  pull_request:
    types: [opened, synchronize]
permissions:
  contents: write
jobs:
  update:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Patch issuer
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/pages/EmissorCertificadosAdmin.jsx')
          s=p.read_text(encoding='utf-8')
          if 'student_credential' in s and 'fontSize(34)' in s:
              print('Already patched')
              raise SystemExit(0)
          s=s.replace('responsibleRole: "Responsável Técnico",\n  modules:', 'responsibleRole: "Responsável Técnico",\n  author: "Vilmar Becker",\n  authorRole: "Autor e Responsável pelo Curso",\n  modules:')
          s=s.replace('const [course,setCourse]=useState(courseFromStorage),[institution,setInstitution]=useState(()=>read(INSTITUTION_KEY,defaultInstitution)),[brand,setBrand]=useState(defaultBrand),[brandReady,setBrandReady]=useState(false),[student,setStudent]=useState({name:"",cpf:"",start:"",end:""}),[certs,setCerts]=useState([]);', 'const [course,setCourse]=useState(courseFromStorage),[institution,setInstitution]=useState(()=>read(INSTITUTION_KEY,defaultInstitution)),[brand,setBrand]=useState(defaultBrand),[brandReady,setBrandReady]=useState(false),[student,setStudent]=useState({name:"",cpf:"",credential:"",start:"",end:"",signature:""}),[certs,setCerts]=useState([]);')
          s=s.replace('responsible: stored.responsible || defaultCourse.responsible, responsibleRole: stored.responsibleRole || defaultCourse.responsibleRole }', 'responsible: stored.responsible || defaultCourse.responsible, responsibleRole: stored.responsibleRole || defaultCourse.responsibleRole, author: stored.author || defaultCourse.author, authorRole: stored.authorRole || defaultCourse.authorRole }')
          start=s.index(' const makePdf=async(certificate)=>{')
          end=s.index('\n const emit=async()=>{', start)
          new_pdf=''' const makePdf=async(certificate)=>{const doc=new jsPDF({orientation:"landscape",unit:"mm",format:"a4"}),W=297,H=210;drawPageFrame(doc,W,H);await addWatermark(doc,brand.neuroLogo,W,H);doc.setTextColor(210,240,250);doc.setFont("helvetica","bold");doc.setFontSize(34);doc.text("CERTIFICADO",W/2,38,{align:"center"});doc.setFontSize(13);doc.setFont("helvetica","normal");doc.text(certificate.course_nature||course.nature,W/2,51,{align:"center"});await addImageContain(doc,brand.enatLogo,18,15,38,38);await addImageContain(doc,brand.neuroLogo,241,15,38,38);doc.setFont("helvetica","bold");doc.setFontSize(24);doc.text(certificate.student_name,W/2,78,{align:"center"});if(certificate.student_credential){doc.setFont("helvetica","normal");doc.setFontSize(13);doc.text(certificate.student_credential,W/2,91,{align:"center"});}doc.setFont("helvetica","normal");doc.setFontSize(13.5);const statement=`Certificamos que o(a) participante acima identificado(a) concluiu com êxito o curso de ${certificate.course_name}, baseado em Neurociência Aplicada ao Trânsito, com carga horária de ${certificate.hours} horas, compreendida entre ${formatDate(certificate.start_date)} e ${formatDate(certificate.end_date)}.`;doc.text(statement,W/2,105,{align:"center",maxWidth:242,lineHeightFactor:1.45});doc.setFont("helvetica","bold");doc.setFontSize(13);doc.text(`${certificate.hours} horas • ${certificate.modality||course.modality}`,W/2,132,{align:"center"});doc.setFont("helvetica","normal");doc.setFontSize(10.5);doc.text(`Registro do certificado: ${certificate.code}`,20,143);doc.text(`Responsável: ${certificate.responsible||course.responsible} — ${certificate.responsible_role||course.responsibleRole}`,20,150);const qr=await QRCode.toDataURL(`${window.location.origin}/validar/${certificate.code}`,{margin:1,width:180});doc.addImage(qr,"PNG",247,139,28,28);doc.setDrawColor(160,190,200);doc.line(40,174,125,174);doc.line(158,174,243,174);doc.setFont("helvetica","normal");doc.setFontSize(9);doc.text(certificate.student_signature||"Assinatura do(a) participante",82.5,181,{align:"center"});doc.setFont("helvetica","bold");doc.setFontSize(11);doc.text(certificate.author||course.author||"Vilmar Becker",200.5,181,{align:"center"});doc.setFont("helvetica","normal");doc.setFontSize(8);doc.text("Participante",82.5,187,{align:"center"});doc.text(certificate.author_role||course.authorRole||"Autor e Responsável pelo Curso",200.5,187,{align:"center",maxWidth:80});doc.setFontSize(7.2);doc.text("Validação pública por QR Code",261,171,{align:"center"});doc.setFontSize(6.5);doc.text("Curso livre de formação, capacitação ou atualização. Este certificado não corresponde a diploma de graduação nem a certificado de pós-graduação lato sensu ou título acadêmico reconhecido pelo MEC.",W/2,199,{align:"center",maxWidth:252});
 doc.addPage();drawPageFrame(doc,W,H);await addWatermark(doc,brand.neuroLogo,W,H);doc.setTextColor(210,240,250);doc.setFont("helvetica","bold");doc.setFontSize(20);doc.text("CONTEÚDO PROGRAMÁTICO E CORPO DOCENTE",W/2,30,{align:"center"});doc.setFont("helvetica","normal");doc.setFontSize(8);doc.text(`${certificate.course_name} • ${certificate.hours} horas • ${formatDate(certificate.start_date)} a ${formatDate(certificate.end_date)}`,W/2,39,{align:"center"});await addImageContain(doc,brand.enatLogo,18,15,28,28);await addImageContain(doc,brand.neuroLogo,251,15,28,28);const modules=Array.isArray(certificate.subjects)?certificate.subjects:assignedSubjects();const cols=[{x:20,w:80,items:modules.slice(0,2)},{x:108,w:80,items:modules.slice(2,4)},{x:196,w:80,items:modules.slice(4)}];cols.forEach((col)=>{let y=51;col.items.forEach((m)=>{doc.setFillColor(15,28,42);doc.rect(col.x,y-5,col.w,5,"F");doc.setFont("helvetica","bold");doc.setFontSize(6.8);doc.setTextColor(210,240,250);doc.text(`${m.title} — ${m.hours} h`,col.x+2,y,{maxWidth:col.w-4});y+=7;doc.setFont("helvetica","normal");doc.setFontSize(6.1);(m.lessons||[]).forEach((l,li)=>{const t=l.teacher||null;doc.setTextColor(220,235,242);doc.text(`${li+1}. ${l.name} — ${l.hours}h`,col.x+3,y,{maxWidth:col.w-6});y+=4.1;if(t){doc.setFontSize(5.6);doc.text(`Docente: ${t.name} — ${t.qualification}; ${t.formation}`,col.x+6,y,{maxWidth:col.w-9});y+=4.1;}});y+=3;});});const legalY=169;doc.setDrawColor(70,190,240);doc.rect(20,legalY,257,26);doc.setFont("helvetica","bold");doc.setFontSize(8);doc.text("INFORMAÇÕES LEGAIS — CURSO LIVRE",24,legalY+5);doc.setFont("helvetica","normal");doc.setFontSize(6.2);doc.text("Conforme orientação do MEC/SERES, cursos livres caracterizam-se pela ausência de atos autorizativos por parte do Poder Público. Este certificado comprova a conclusão e a carga horária do curso, não correspondendo a diploma de curso superior, grau acadêmico ou certificado de pós-graduação lato sensu. Sua aceitação para fins profissionais, institucionais, concursos, processos seletivos ou aproveitamento de estudos depende das normas aplicáveis pela instituição ou órgão destinatário.",24,legalY+10,{maxWidth:248,lineHeightFactor:1.3});doc.setFontSize(5.8);doc.text("Referência: Ministério da Educação — MEC/SERES — Perguntas Frequentes: Cursos Livres.",24,legalY+22,{maxWidth:248});doc.setFontSize(5.8);doc.text("Documento integrante do certificado. Componentes curriculares, docentes e cargas horárias correspondem aos registros da instituição emissora.",W/2,199,{align:"center",maxWidth:250});doc.save(`${certificate.code}_${certificate.student_name.replace(/[^a-z0-9]+/gi,"_")}.pdf`);};'''
          s=s[:start]+new_pdf+s[end:]
          s=s.replace('student_name:student.name.trim(),cpf_hash:await hashCpf(student.cpf),course_name:course.name', 'student_name:student.name.trim(),student_credential:student.credential.trim()||null,student_signature:student.signature.trim()||null,cpf_hash:await hashCpf(student.cpf),course_name:course.name')
          s=s.replace('responsible:course.responsible,institution_name:institution.name', 'responsible:course.responsible,author:course.author||"Vilmar Becker",institution_name:institution.name')
          s=s.replace('setStudent({name:"",cpf:"",start:"",end:""});refresh();', 'setStudent({name:"",cpf:"",credential:"",start:"",end:"",signature:""});refresh();')
          s=s.replace('<label>CPF<input value={maskCpf(student.cpf)} onChange={e=>setStudent({...student,cpf:e.target.value})}/></label>', '<label>CPF<input value={maskCpf(student.cpf)} onChange={e=>setStudent({...student,cpf:e.target.value})}/></label><label>Credencial DETRAN/UF <span className="hint">(opcional)</span><input placeholder="Ex.: 123456/SC" value={student.credential} onChange={e=>setStudent({...student,credential:e.target.value})}/></label><label>Assinatura do(a) aluno(a) <span className="hint">(opcional)</span><input placeholder="Nome para assinatura ou deixe em branco para assinatura manual" value={student.signature} onChange={e=>setStudent({...student,signature:e.target.value})}/></label>')
          s=s.replace('<label>Função do responsável<input value={course.responsibleRole} onChange={e=>updateCourseField("responsibleRole",e.target.value)}/></label>', '<label>Função do responsável<input value={course.responsibleRole} onChange={e=>updateCourseField("responsibleRole",e.target.value)}/></label><label>Autor do curso<input value={course.author||""} onChange={e=>updateCourseField("author",e.target.value)}/></label><label>Função do autor<input value={course.authorRole||"Autor e Responsável pelo Curso"} onChange={e=>updateCourseField("authorRole",e.target.value)}/></label>')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate build
        run: |
          npm ci
          npm run build
      - name: Commit patch to PR branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/EmissorCertificadosAdmin.jsx
          git commit -m 'chore: apply certificate issuer update [skip ci]' || exit 0
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

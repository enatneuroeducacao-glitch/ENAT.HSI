name: Fix certificate student autofill
on:
  push:
    paths:
      - '.github/workflows/fix-cpf-autofill.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch issuer and PDF page 2
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/pages/EmissorCertificadosFinal.jsx')
          s=p.read_text()
          old='const emit=async()=>{if(!student.name.trim()||digits(student.cpf).length!==11)return setMsg("Informe nome completo e CPF válido.");'
          new='const emit=async()=>{const name=String(student.name||document.getElementById("student-name")?.value||"").trim();const cpf=digits(student.cpf||document.getElementById("student-cpf")?.value||"");if(!name||cpf.length!==11)return setMsg("Informe nome completo e CPF válido.");'
          if old in s: s=s.replace(old,new,1)
          s=s.replace('student_name:student.name.trim(),student_credential:', 'student_name:name,student_credential:',1)
          s=s.replace('new TextEncoder().encode(digits(student.cpf))', 'new TextEncoder().encode(cpf)',1)
          s=s.replace('<label>Nome completo<input value={student.name}', '<label>Nome completo<input id="student-name" value={student.name}',1)
          s=s.replace('<label>CPF<input value={cpfMask(student.cpf)}', '<label>CPF<input id="student-cpf" value={cpfMask(student.cpf)}',1)
          start=s.find('doc.addPage();frame(doc,W,H);',s.find('const makePDF=async c=>{'))
          end=s.find('doc.save(`${c.code}_${c.student_name.replace(/[^a-z0-9]+/gi,"_")}.pdf`)};',start)
          if start<0 or end<0: raise SystemExit('PDF page 2 markers not found')
          end += len('doc.save(`${c.code}_${c.student_name.replace(/[^a-z0-9]+/gi,"_")}.pdf`)};')
          page2=r'''doc.addPage();frame(doc,W,H);await watermark(doc,brand.neuroLogo,W,H);doc.setTextColor(210,240,250);doc.setFont("helvetica","bold");doc.setFontSize(18);doc.text("CONTEÚDO PROGRAMÁTICO E CORPO DOCENTE",W/2,24,{align:"center"});doc.setFont("helvetica","normal");doc.setFontSize(8);doc.text(`${c.course_name} • ${c.hours} horas • ${dateBR(c.start_date)} a ${dateBR(c.end_date)}`,W/2,33,{align:"center"});await addImg(doc,brand.enatLogo,14,11,24,24);await addImg(doc,brand.neuroLogo,259,11,24,24);
          const rows=[];(Array.isArray(c.subjects)?c.subjects:subjects()).forEach((m,mi)=>(m.lessons||[]).forEach((l,li)=>{const t=l.teacher||{};rows.push({module:`Módulo ${mi+1}\n${m.title.replace(/^Módulo\s+\d+\s*[–-]\s*/i,"")}`,lesson:`${li+1}. ${l.name}`,hours:`${l.hours}h`,teacher:t.name||"—",qualification:t.qualification||"—",formation:t.formation||"—"})}));
          const x=[10,48,137,154,202,228,287],heads=["MÓDULO","AULA","CARGA","DOCENTE RESPONSÁVEL","TITULAÇÃO","FORMAÇÃO / ÁREA"],hy=40,hh=8;doc.setFillColor(24,67,105);doc.setDrawColor(70,190,240);doc.setLineWidth(.3);for(let i=0;i<6;i++){doc.rect(x[i],hy,x[i+1]-x[i],hh,"FD");doc.setFont("helvetica","bold");doc.setFontSize(6.2);doc.setTextColor(235,247,252);doc.text(heads[i],(x[i]+x[i+1])/2,hy+5.2,{align:"center",maxWidth:x[i+1]-x[i]-2})}
          const rh=5.25;rows.forEach((r,i)=>{const y=hy+hh+i*rh;for(let j=0;j<6;j++){doc.setFillColor(i%2?12:16,i%2?27:33,i%2?43:51);doc.setDrawColor(70,110,140);doc.rect(x[j],y,x[j+1]-x[j],rh,"FD")}const vals=[r.module,r.lesson,r.hours,r.teacher,r.qualification,r.formation];vals.forEach((v,j)=>{doc.setFont("helvetica",j===0?"bold":"normal");doc.setFontSize(j===0?4.8:5.15);doc.setTextColor(220,235,242);doc.text(v,j===2?(x[j]+x[j+1])/2:x[j]+1.6,y+(j===0?2.0:3.45),{align:j===2?"center":"left",maxWidth:x[j+1]-x[j]-2.5,lineHeightFactor:1.0})})});
          const ly=160;doc.setDrawColor(70,190,240);doc.setLineWidth(.5);doc.rect(10,ly,277,35);doc.setFont("helvetica","bold");doc.setFontSize(7.4);doc.setTextColor(210,240,250);doc.text("INFORMAÇÕES LEGAIS — CURSO LIVRE",14,ly+5);doc.setFont("helvetica","normal");doc.setFontSize(6.0);doc.text("Conforme orientação do MEC/SERES, cursos livres caracterizam-se pela ausência de atos autorizativos por parte do Poder Público. Este certificado comprova a conclusão e a carga horária do curso, não correspondendo a diploma de curso superior, grau acadêmico ou certificado de pós-graduação lato sensu.",14,ly+10,{maxWidth:269,lineHeightFactor:1.22});doc.text("Sua aceitação para fins profissionais, institucionais, concursos, processos seletivos ou aproveitamento de estudos depende das normas aplicáveis pela instituição ou órgão destinatário.",14,ly+18,{maxWidth:269,lineHeightFactor:1.22});doc.setFontSize(5.7);doc.text(`Responsável: ${c.responsible||course.responsible} • Autor: ${c.author||course.author||"Vilmar Becker"} • Carga horária: ${c.hours} horas • Modalidade: ${c.modality||course.modality}`,14,ly+25,{maxWidth:269});doc.text("Referência: Ministério da Educação — MEC/SERES — Perguntas Frequentes: Cursos Livres.",14,ly+30,{maxWidth:269});doc.setFontSize(5.4);doc.text("Documento integrante do certificado. Componentes curriculares, docentes e cargas horárias correspondem aos registros da instituição emissora.",W/2,202,{align:"center",maxWidth:270});doc.save(`${c.code}_${c.student_name.replace(/[^a-z0-9]+/gi,"_")}.pdf`)};'''
          s=s[:start]+page2+s[end:]
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/EmissorCertificadosFinal.jsx
          git diff --cached --quiet || git commit -m 'Reorganiza página 2 e restaura informações legais'
          git push

name: Fix certificate student autofill
on:
  push:
    paths:
      - '.github/workflows/fix-cpf-autofill.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch issuer
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('src/pages/EmissorCertificadosFinal.jsx')
          s=p.read_text()
          old='const emit=async()=>{if(!student.name.trim()||digits(student.cpf).length!==11)return setMsg("Informe nome completo e CPF válido.");'
          new='const emit=async()=>{const name=String(student.name||document.getElementById("student-name")?.value||"").trim();const cpf=digits(student.cpf||document.getElementById("student-cpf")?.value||"");if(!name||cpf.length!==11)return setMsg("Informe nome completo e CPF válido.");'
          if old in s:
            s=s.replace(old,new,1)
          s=s.replace('student_name:student.name.trim(),student_credential:', 'student_name:name,student_credential:',1)
          s=s.replace('new TextEncoder().encode(digits(student.cpf))', 'new TextEncoder().encode(cpf)',1)
          s=s.replace('<label>Nome completo<input value={student.name}', '<label>Nome completo<input id="student-name" value={student.name}',1)
          s=s.replace('<label>CPF<input value={cpfMask(student.cpf)}', '<label>CPF<input id="student-cpf" value={cpfMask(student.cpf)}',1)
          start=s.find('const makePDF=async c=>{')
          end=s.find('\n if(!session)',start)
          if start<0 or end<0: raise SystemExit('makePDF block not found')
          fn=r'''const makePDF=async c=>{const doc=new jsPDF({orientation:"landscape",unit:"mm",format:"a4"}),W=297,H=210;frame(doc,W,H);await watermark(doc,brand.neuroLogo,W,H);doc.setTextColor(210,240,250);doc.setFont("helvetica","bold");doc.setFontSize(34);doc.text("CERTIFICADO",W/2,38,{align:"center"});doc.setFontSize(13);doc.setFont("helvetica","normal");doc.text(c.course_nature||course.nature,W/2,51,{align:"center"});await addImg(doc,brand.enatLogo,18,15,38,38);await addImg(doc,brand.neuroLogo,241,15,38,38);doc.setFont("helvetica","bold");doc.setFontSize(24);doc.text(c.student_name,W/2,78,{align:"center"});if(c.student_credential){doc.setFont("helvetica","normal");doc.setFontSize(13);doc.text(`Credencial DETRAN/UF: ${c.student_credential}`,W/2,91,{align:"center"})}doc.setFont("helvetica","normal");doc.setFontSize(13.5);const st=`Certificamos que o(a) participante acima identificado(a) concluiu com êxito o curso de ${c.course_name}, baseado em Neurociência Aplicada ao Trânsito, com carga horária de ${c.hours} horas, compreendida entre ${dateBR(c.start_date)} e ${dateBR(c.end_date)}.`;doc.text(st,W/2,105,{align:"center",maxWidth:242,lineHeightFactor:1.45});doc.setFont("helvetica","bold");doc.setFontSize(13);doc.text(`${c.hours} horas • ${c.modality||course.modality}`,W/2,132,{align:"center"});doc.setFont("helvetica","normal");doc.setFontSize(10.5);doc.text(`Registro do certificado: ${c.code}`,20,143);doc.text(`Responsável: ${c.responsible||course.responsible} — ${c.responsible_role||course.responsibleRole}`,20,150);const qr=await QRCode.toDataURL(`${window.location.origin}/validar/${c.code}`,{margin:1,width:180});doc.addImage(qr,"PNG",247,139,28,28);doc.setDrawColor(160,190,200);doc.line(40,174,125,174);doc.line(158,174,243,174);doc.setFont("times","italic");doc.setTextColor(225,240,248);doc.setFontSize(15);doc.text(c.student_signature||"Assinatura do(a) participante",82.5,181,{align:"center"});doc.setFont("helvetica","bold");doc.setFontSize(12);doc.text(c.author||course.author||"Vilmar Becker",200.5,180,{align:"center"});doc.setDrawColor(70,190,240);doc.setLineWidth(.55);doc.line(174,183,227,183);doc.line(222,182.8,228,180.8);doc.setFont("helvetica","normal");doc.setFontSize(8);doc.text("Participante",82.5,188,{align:"center"});doc.text(c.author_role||course.authorRole||"Autor e Responsável pelo Curso",200.5,189,{align:"center",maxWidth:80});doc.setFontSize(7.2);doc.text("Validação pública por QR Code",261,171,{align:"center"});doc.setFontSize(6.5);doc.text("Curso livre de formação, capacitação ou atualização. Este certificado não corresponde a diploma de graduação nem a certificado de pós-graduação lato sensu ou título acadêmico reconhecido pelo MEC.",W/2,199,{align:"center",maxWidth:252});
          doc.addPage();frame(doc,W,H);await watermark(doc,brand.neuroLogo,W,H);doc.setTextColor(210,240,250);doc.setFont("helvetica","bold");doc.setFontSize(19);doc.text("CONTEÚDO PROGRAMÁTICO E CORPO DOCENTE",W/2,25,{align:"center"});doc.setFont("helvetica","normal");doc.setFontSize(8.5);doc.text(`${c.course_name} • ${c.hours} horas • ${dateBR(c.start_date)} a ${dateBR(c.end_date)}`,W/2,34,{align:"center"});await addImg(doc,brand.enatLogo,14,12,25,25);await addImg(doc,brand.neuroLogo,258,12,25,25);
          const rows=[];(Array.isArray(c.subjects)?c.subjects:subjects()).forEach((m,mi)=>(m.lessons||[]).forEach((l,li)=>{const t=l.teacher||{};rows.push({module:`Módulo ${mi+1}\n${m.title.replace(/^Módulo\s+\d+\s*[–-]\s*/i,"")}`,lesson:`${li+1}. ${l.name}`,hours:`${l.hours}h`,teacher:t.name||"—",qualification:t.qualification||"—",formation:t.formation||"—"})}));
          const x=[10,48,137,154,202,228,287],heads=["MÓDULO","AULA","CARGA","DOCENTE RESPONSÁVEL","TITULAÇÃO","FORMAÇÃO / ÁREA"],hy=43,hh=9;doc.setFillColor(24,67,105);doc.setDrawColor(70,190,240);doc.setLineWidth(.35);for(let i=0;i<6;i++){doc.rect(x[i],hy,x[i+1]-x[i],hh,"FD");doc.setFont("helvetica","bold");doc.setFontSize(6.5);doc.setTextColor(235,247,252);doc.text(heads[i],(x[i]+x[i+1])/2,hy+5.8,{align:"center",maxWidth:x[i+1]-x[i]-2})}
          const rh=6.25;rows.forEach((r,i)=>{const y=hy+hh+i*rh;for(let j=0;j<6;j++){doc.setFillColor(i%2?12:16, i%2?27:33, i%2?43:51);doc.setDrawColor(70,110,140);doc.rect(x[j],y,x[j+1]-x[j],rh,"FD")}const vals=[r.module,r.lesson,r.hours,r.teacher,r.qualification,r.formation];vals.forEach((v,j)=>{doc.setFont("helvetica",j===0?"bold":"normal");doc.setFontSize(j===0?5.25:5.65);doc.setTextColor(220,235,242);const yy=y+(j===0?2.2:4.0);doc.text(v,(j===2?(x[j]+x[j+1])/2:x[j]+2),yy,{align:j===2?"center":"left",maxWidth:x[j+1]-x[j]-3,lineHeightFactor:1.05})})});
          const fy=hy+hh+rows.length*rh+3;doc.setDrawColor(70,190,240);doc.rect(10,fy,277,18);doc.setFont("helvetica","bold");doc.setFontSize(7.2);doc.setTextColor(210,240,250);doc.text("IDENTIFICAÇÃO ACADÊMICA DO CURSO",14,fy+5);doc.setFont("helvetica","normal");doc.setFontSize(6.2);doc.text(`Responsável: ${c.responsible||course.responsible} • Autor: ${c.author||course.author||"Vilmar Becker"} • Carga horária: ${c.hours} horas • Modalidade: ${c.modality||course.modality}`,14,fy+10,{maxWidth:269});doc.text("Os docentes são apresentados com nome, titulação e formação/área. Instituição de formação e registro profissional permanecem apenas no cadastro administrativo.",14,fy+14.5,{maxWidth:269});doc.setFont("helvetica","normal");doc.setFontSize(5.6);doc.setTextColor(190,210,220);doc.text("Documento integrante do certificado. Componentes curriculares, docentes e cargas horárias correspondem aos registros da instituição emissora.",W/2,199,{align:"center",maxWidth:270});doc.save(`${c.code}_${c.student_name.replace(/[^a-z0-9]+/gi,"_")}.pdf`)};'''
          s=s[:start]+fn+s[end:]
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/EmissorCertificadosFinal.jsx
          git diff --cached --quiet || git commit -m 'Organiza PDF curricular e assinatura digital'
          git push

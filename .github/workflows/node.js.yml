# Continuous integration for the Central ENAT HSI
name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    # package.json was updated with Supabase and QR dependencies before the lockfile
    # could be regenerated. npm install keeps CI reproducible enough to validate the
    # current application while the lockfile is synchronized in the next maintenance pass.
    - run: npm install --no-audit --no-fund
    - run: npm run build --if-present
    - run: npm test --if-present
